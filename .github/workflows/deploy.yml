name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io//williamwangl/river-ad-workspace

jobs:
  build-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push river-server
        uses: docker/build-push-action@v5
        with:
          context: ./river-server
          file: ./river-server/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/river-server:latest
          cache-from: type=gha,scope=river-server
          cache-to: type=gha,mode=max,scope=river-server

  build-ui-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push river-ui-admin
        uses: docker/build-push-action@v5
        with:
          context: ./river-ui-admin
          file: ./river-ui-admin/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/river-ui-admin:latest
          cache-from: type=gha,scope=river-ui-admin
          cache-to: type=gha,mode=max,scope=river-ui-admin

  build-ecommica:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push river-ecommica
        uses: docker/build-push-action@v5
        with:
          context: ./river-ecommica
          file: ./river-ecommica/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/river-ecommica:latest
          cache-from: type=gha,scope=river-ecommica
          cache-to: type=gha,mode=max,scope=river-ecommica

  deploy:
    needs: [build-server, build-ui-admin, build-ecommica]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker/docker-compose.prod.yml,docker/nginx/nginx.conf"
          target: "/opt/river"
          strip_components: 1

      - name: Extract admin static files
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/river

            # 登录 ghcr.io
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 提取 admin 静态文件
            docker pull ${{ env.IMAGE_PREFIX }}/river-ui-admin:latest
            docker create --name temp-admin ${{ env.IMAGE_PREFIX }}/river-ui-admin:latest
            rm -rf /opt/river/admin-dist
            mkdir -p /opt/river/admin-dist
            docker cp temp-admin:/usr/share/nginx/html/. /opt/river/admin-dist/
            docker rm temp-admin

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/river

            # 创建必要目录
            mkdir -p data/mysql data/redis data/server-logs ssl nginx admin-dist

            # 如果没有 SSL 证书，创建自签名证书（用于首次部署测试）
            if [ ! -f ssl/deals.ecommica.com_bundle.pem ]; then
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout ssl/deals.ecommica.com.key -out ssl/deals.ecommica.com_bundle.pem \
                -subj "/CN=deals.ecommica.com"
              echo "Created self-signed SSL certificate"
            fi

            # 创建环境变量文件
            echo "GITHUB_REPO=${{ github.repository }}" > .env
            echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env

            # 拉取最新镜像并重启服务
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --force-recreate

            # 确保 nginx 重新加载静态文件（admin-dist 可能在容器运行时被更新）
            docker restart river-nginx

            # 清理旧镜像
            docker image prune -f
