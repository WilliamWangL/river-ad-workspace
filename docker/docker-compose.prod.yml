version: '3.8'

# 生产编排：数据库、Redis、后端、站点、Nginx。
# 日志：river-server 应用日志与 mediabuy 点击行日志挂载到宿主机 ./data/server-logs -> 容器 /app/logs
# 端口：可通过环境变量绑定宿主机地址（默认 127.0.0.1 仅本机；设为 0.0.0.0 对外暴露）
#   RIVER_SERVER_BIND、RIVER_ECOMMICA_BIND、RIVER_HTTP_BIND、RIVER_HTTPS_BIND

services:
  # MySQL 使用宿主机已有的实例（非容器），river-server 通过 host-gateway 连接

  redis:
    image: redis:7-alpine
    container_name: river-redis
    restart: always
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - river-network

  river-server:
    image: ghcr.io/${GITHUB_REPO:-river}/river-server:latest
    container_name: river-server
    restart: always
    ports:
      - "${RIVER_SERVER_BIND:-127.0.0.1}:48080:48080"
    volumes:
      - ./data/server-logs:/app/logs
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Shanghai
      - MYSQL_HOST=host.docker.internal
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DB=${MYSQL_DB:-river}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:48080/test || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - river-network

  river-ecommica:
    image: ghcr.io/${GITHUB_REPO:-river}/river-ecommica:latest
    container_name: river-ecommica
    restart: always
    ports:
      - "${RIVER_ECOMMICA_BIND:-127.0.0.1}:3000:3000"
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://river-server:48080/app-api
    depends_on:
      river-server:
        condition: service_healthy
    networks:
      - river-network

  nginx:
    image: nginx:alpine
    container_name: river-nginx
    restart: always
    ports:
      - "${RIVER_HTTP_BIND:-0.0.0.0}:80:80"
      - "${RIVER_HTTPS_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./admin-dist:/opt/share/nginx:ro
    depends_on:
      river-server:
        condition: service_healthy
      river-ecommica:
        condition: service_started
    networks:
      - river-network

networks:
  river-network:
    driver: bridge
